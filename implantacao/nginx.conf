# Proxy reverso para o ObraPlan. Depois de copiar para
# /etc/nginx/sites-available/obraplan, troque DOMINIO pelo seu domínio e
# rode `certbot --nginx -d DOMINIO` para o HTTPS.
server {
    listen 80;
    server_name DOMINIO;

    # Foto de celular passa fácil de 1 MB, que é o limite padrão do nginx.
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
